server:
  port: 8080

spring:
  application:
    name: flowdesk-backend
  datasource:
    url: jdbc:h2:file:./flowdeskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  h2:
    console:
      enabled: true
      path: /h2-console

flowdesk:
  python:
    url: http://localhost:8001
  cpp:
    binaryPath: ../priority-engine-cpp/build/Release/priority_engine.exe
  soap:
    url: http://localhost:8002/hr
